<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Accent Neutralizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #output {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Speech Accent Neutralizer</h1>
    <button onclick="startRecognition()">Start Speaking</button>
    <div id="output"></div>

    <script>
        function startRecognition() {
            fetch('/recognize_speech')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('output').innerText = data.message;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('output').innerText = 'An error occurred. Please try again.';
                });
        }
    </script>
</body>
</html>
